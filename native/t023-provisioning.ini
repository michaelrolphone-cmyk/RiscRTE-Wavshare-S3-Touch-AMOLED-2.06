[platformio]
extra_configs =
  platformio.ini
  expanded-candidate.ini

; Exact T064 native profile with explicit internal package custody.
; No partition change, boot formatting, or package authority expansion.
[env:waveshare-t023]
extends = env:waveshare-t051
build_flags =
  ${env:waveshare-t051.build_flags}
  -DRISC_NATIVE_PACKAGE_VOLUME=1
  -I${PROJECT_DIR}
  -DRISC_NATIVE_APP_DATA_EXPORT_POLICY_V2_HEADER=\"t023-migration-policy.h\"

; Opt-in native-first bridge. Requires the combined, tested Runtime request,
; complete-file-inventory and boot-app internal-fallback checkpoints.
; Build installed-apps with --native-feed --boot-profiles --internal-packages.
[env:waveshare-t023-boot-profiles]
extends = env:waveshare-t023
build_flags =
  ${env:waveshare-t023.build_flags}
  -DRISC_NATIVE_PROVISION_REQUEST=1
