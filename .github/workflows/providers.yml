name: Waveshare watch providers
on:
  push:
    branches: [feat/universal-watch, main]
  pull_request:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: e49a3da30682eef7bf55716fa8223ac615eebb02
          path: .source/shared
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 14762601b3fa7bbeeac5ed565a6825534bf74dca
          path: .source/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 422e1e81a498fb6bdab9abf086325afc05a532dc
          path: .source/drivers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: fe20777f374a7a93bc8e44019ebcb851c5584bb9
          path: .source/runtime
          persist-credentials: false
      - name: Test physical providers, generic contracts and actual board parser
        run: |
          cmp include/RiscAudioPcmV1.h .source/drivers/sdk/driver/RiscAudioPcmV1.h
          cmp include/RiscI2sStandardV1.h .source/runtime/sdk/driver/RiscI2sStandardV1.h
          cmp include/RiscGpioSdmmcV1.h .source/runtime/sdk/driver/RiscGpioSdmmcV1.h
          python3 scripts/test_board_profile.py
          bash .source/runtime/test/run_board_test.sh "$PWD/hardware/board.json"
          python3 .source/shared/scripts/check_capability_boundaries.py --provider-root "$PWD"
          python3 scripts/test_drivers.py --watch .source/shared
          python3 scripts/test_drivers.py --watch .source/shared --sanitize
          python3 scripts/test_storage.py --watch .source/shared
          python3 scripts/test_storage.py --watch .source/shared --sanitize
          python3 .source/drivers/scripts/test_audio.py --wave "$PWD" --watch .source/shared
          python3 .source/drivers/scripts/test_audio.py --wave "$PWD" --watch .source/shared --sanitize
      - name: Prepare pinned compiler
        run: |
          mkdir -p .source/toolchain
          curl --fail --location --retry 2 --max-time 180 https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz -o "$RUNNER_TEMP/toolchain.tar.gz"
          echo "8aa17a6adf01efa5b1628c8ac578063a44d26ae9581d39486b92223a41ef262f  $RUNNER_TEMP/toolchain.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C .source/toolchain
          python3 -m pip install pyelftools==0.32
      - name: Build all physical and reusable audio providers
        run: |
          compiler="$PWD/.source/toolchain/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc"
          python3 scripts/build_drivers.py --watch .source/shared --system .source/system --cc "$compiler"
          python3 .source/drivers/scripts/build_audio.py --watch .source/shared --cc "$compiler" --validator dist/providers/validate-elf --output dist/audio
          git rev-parse HEAD > dist/COMMIT.txt
          git archive HEAD | gzip > dist/source.tar.gz
          cp -r hardware dist/
          mkdir -p dist/licenses
          cp /usr/share/common-licenses/Apache-2.0 dist/licenses/Apache-2.0.txt
          cp THIRD_PARTY_NOTICES.md dist/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: waveshare-watch-providers
          path: |
            dist/providers/**/driver.elf
            dist/providers/**/manifest.json
            dist/providers/build.json
            dist/audio/**/driver.elf
            dist/audio/**/manifest.json
            dist/audio/build.json
            dist/hardware/*
            dist/licenses/*
            dist/COMMIT.txt
            dist/source.tar.gz
          retention-days: 30
