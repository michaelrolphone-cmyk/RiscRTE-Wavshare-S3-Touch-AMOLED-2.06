name: Waveshare LoRa 0.1.17 external-media companion

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified separate media prerelease
        required: true
        type: boolean
        default: false
  push:
    branches: [fix/lora-media-0.1.17]
    paths:
      - .github/workflows/lora-media-release.yml
      - scripts/package_lora_media.py
      - scripts/test_lora_media_release.py
      - docs/lora-media/**

permissions:
  contents: read

concurrency:
  group: waveshare-test-lora-media-0.1.17
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASELINE_TAG: test-shared-suite-0.1.22
  RELEASE_TAG: test-lora-media-0.1.17
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
  PYTHONDONTWRITEBYTECODE: '1'
  ASAN_OPTIONS: detect_leaks=0

jobs:
  package:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
      runtime_revision: ${{ steps.pins.outputs.runtime_revision }}
      system_revision: ${{ steps.pins.outputs.system_revision }}
      publication_enabled: ${{ steps.pins.outputs.publication_enabled }}
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact generator Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read immutable source pins
        id: pins
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          pins = json.loads(Path('docs/lora-media/source-pins.json').read_bytes())
          assert pins['release_tag'] == os.environ['RELEASE_TAG']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('publication_enabled=' + str(pins['publication_enabled']).lower(), file=out)
              for key in ('runtime_revision', 'system_revision'):
                  assert re.fullmatch('[0-9a-f]{40}', pins[key])
                  print(key + '=' + pins[key], file=out)
          PYTHON
      - name: Check out exact published System producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_revision }}
          path: .source/system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact delivered Runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime_revision }}
          path: .source/runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned compiler and validate package guards
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.19 pyelftools==0.32 pillow==11.3.0
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python3 scripts/test_lora_media_release.py
          python3 .source/system/docs/shared-app-crashes/replay/test_checked_xtensa_link.py
          git diff --exit-code
      - name: Download exact official predecessor card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .inputs
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern 'Waveshare-0.1.22-SD-card.zip' --dir .inputs
      - name: Rebuild LoRa, qualify contracts, and package complete media
        run: |
          set -euo pipefail
          python3 scripts/package_lora_media.py \
            --baseline .inputs/Waveshare-0.1.22-SD-card.zip \
            --system .source/system --runtime .source/runtime \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --source-revision "$GITHUB_SHA" --output dist/lora-media
          (cd dist/lora-media/assets && sha256sum --check --strict SHA256SUMS.txt)
      - name: Bind publication to verified asset manifest
        id: digest
        run: echo "sha256=$(sha256sum dist/lora-media/assets/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain verified media release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waveshare-lora-media-${{ github.sha }}
          path: dist/lora-media/assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: package
    if: needs.package.outputs.publication_enabled == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06' && github.ref == 'refs/heads/fix/lora-media-0.1.17'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: waveshare-lora-media-${{ github.sha }}
          path: release-assets
      - name: Verify publication asset hashes and exact source
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
          RUNTIME_REVISION: ${{ needs.package.outputs.runtime_revision }}
          SYSTEM_REVISION: ${{ needs.package.outputs.system_revision }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          if release['source_revision'] != os.environ['GITHUB_SHA'] or release['runtime_revision'] != os.environ['RUNTIME_REVISION'] or release['system_revision'] != os.environ['SYSTEM_REVISION']:
              raise SystemExit('Release source ID mismatch; STOP')
          expected = {line.split('  ', 1)[1] for line in Path('SHA256SUMS.txt').read_text().splitlines()}
          if {p.name for p in Path('.').iterdir()} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('Unverified extra or missing asset; STOP')
          PY
      - name: Publish new prerelease without reusing tags or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh api "repos/$PRODUCT_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/matching-tags.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'matching-tags.json').read_text())
          if any(row['ref'] == 'refs/tags/' + os.environ['RELEASE_TAG'] for row in refs):
              raise SystemExit('Tag already exists; refusing reuse')
          PY
          gh release create "$RELEASE_TAG" release-assets/* --repo "$PRODUCT_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Waveshare LoRa 0.1.17 external-media repair' \
            --notes-file release-assets/RELEASE-NOTES.txt
      - name: Verify published source and downloaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir downloaded-release
          cd downloaded-release
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
