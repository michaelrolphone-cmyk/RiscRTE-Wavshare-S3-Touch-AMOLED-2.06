name: Waveshare serial recovery native qualification
on:
  push:
    branches: [release/sd-apps-0.1.58]
  pull_request:
    paths:
      - .github/workflows/serial-recovery-native.yml
      - scripts/*serial_recovery*.py
      - scripts/run_serial_recovery_native_ci.sh
      - docs/serial-stat-recovery/**
      - profiles/provisioning-native.cmake
      - tests/provisioning_admission_fixture.inc
permissions:
  contents: read
concurrency:
  group: wave-serial-recovery-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    outputs:
      publication_enabled: ${{ steps.build.outputs.publication_enabled }}
      release_tag: ${{ steps.build.outputs.release_tag }}
      release_branch: ${{ steps.build.outputs.release_branch }}
      version: ${{ steps.build.outputs.version }}
      checksums_sha256: ${{ steps.build.outputs.checksums_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CCACHE_DISABLE: '1'
      IDF_CCACHE_ENABLE: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone exact product source as shell owner
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libssl-dev
          export NATIVE_ROOT="$RUNNER_TEMP/wave-serial-recovery-native"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$NATIVE_ROOT"
          mkdir -p "$NATIVE_ROOT/sources"
          git init --quiet "$NATIVE_ROOT/sources/product"
          git -C "$NATIVE_ROOT/sources/product" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$NATIVE_ROOT/sources/product" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$NATIVE_ROOT/sources/product" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$NATIVE_ROOT/sources/product" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build exact native product and qualify complete provisioning store and core feed
        id: build
        run: bash "$NATIVE_ROOT/sources/product/scripts/run_serial_recovery_native_ci.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: wave-serial-recovery-release-${{ github.sha }}
          path: ${{ env.NATIVE_ROOT }}/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wave-serial-recovery-evidence-${{ github.sha }}
          path: |
            ${{ env.NATIVE_ROOT }}/logs/
            ${{ env.NATIVE_ROOT }}/metadata/
            ${{ env.NATIVE_ROOT }}/build/native-build-evidence/
            ${{ env.NATIVE_ROOT }}/build/log/
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.elf
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.bin
            ${{ env.NATIVE_ROOT }}/build/riscrte_native.map
            ${{ env.NATIVE_ROOT }}/default-a/build.json
            ${{ env.NATIVE_ROOT }}/default-b/build.json
            ${{ env.NATIVE_ROOT }}/providers/catalog/build.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
  publish:
    needs: native
    if: needs.native.outputs.publication_enabled == 'true' && github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06' && github.ref == format('refs/heads/{0}', needs.native.outputs.release_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: product
    env:
      RELEASE_TAG: ${{ needs.native.outputs.release_tag }}
      VERSION: ${{ needs.native.outputs.version }}
      EXPECTED_SHA: ${{ needs.native.outputs.checksums_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wave-serial-recovery-release-${{ github.sha }}
          path: release-assets
      - name: Verify source-bound complete release bytes
        run: python3 scripts/serial_recovery_release.py --verify ../release-assets --expected-sha "$EXPECTED_SHA" --source-revision "$GITHUB_SHA"
      - name: Publish or resume exact-source draft; verify every asset before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_serial_recovery_release.py --assets ../release-assets --expected-sha "$EXPECTED_SHA" --source-revision "$GITHUB_SHA"
      - name: Publish verified credential-free core feed after immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_serial_recovery_feed.py --assets ../release-assets --expected-sha "$EXPECTED_SHA" --source-revision "$GITHUB_SHA"
      - name: Build, reject mutations and publish canonical full SD pair for actual release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_serial_recovery_pair_publication.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wave-serial-recovery-pair-${{ github.sha }}
          path: ${{ runner.temp }}/wave-canonical-pair/publication/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
