name: Home NS deferral boundaries
on:
  push:
    branches: [fix/ns-home-return, main]
    paths: ['tests/serial_stat_home/home_ns_controls.inc', 'scripts/test_home_ns_boundaries.py', '.github/workflows/home-ns-boundaries.yml']
  pull_request:
    paths: ['tests/serial_stat_home/home_ns_controls.inc', 'scripts/test_home_ns_boundaries.py', '.github/workflows/home-ns-boundaries.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: b00d4e7d36fc69c8defd250a82f6af077c732137
          path: .watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: bb0cadf3cec3445a64e11513b47b2676f3fdd92d
          path: .system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 4fdcad2495c33fe63f5f6faca9b11ced3c739a5b
          path: .utilities
          persist-credentials: false
      - name: Replay eight Home NS deferral controls
        run: python3 scripts/test_home_ns_boundaries.py --watch .watch --system .system --utilities .utilities --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-ns-boundaries-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence
          if-no-files-found: error
