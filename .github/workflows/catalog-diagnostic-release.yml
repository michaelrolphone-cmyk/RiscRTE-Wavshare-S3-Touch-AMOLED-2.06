name: Waveshare 0.1.41 catalog diagnostic release

on:
  push:
    branches: [fix/t063-catalog-diagnostic]
    paths:
      - .github/workflows/catalog-diagnostic-release.yml
      - scripts/assemble_catalog_diagnostic.py
      - scripts/package_catalog_diagnostic.py
      - scripts/test_catalog_diagnostic_preservation.py
      - scripts/build_catalog_diagnostic_target.py
      - docs/t063-catalog-diagnostic/**

permissions:
  contents: read

concurrency:
  group: waveshare-test-catalog-diagnostic-0.1.41
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASELINE_TAG: test-catalog-display-0.1.39
  RELEASE_TAG: test-catalog-diagnostic-0.1.41
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
  RUNTIME_REVISION: c258c4ba144247b6eaa4c6f28675ffccec582fe1
  SYSTEM_REVISION: 326396614def41f4a3b11c8c193c3ac1bbb75ab0
  IMAGE_HELPER_REVISION: 265b2804737595d3534370ca747dc01c4d29bf82
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  package:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out pinned Runtime helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: c258c4ba144247b6eaa4c6f28675ffccec582fe1
          path: .source/runtime
          persist-credentials: false
      - name: Check out pinned image helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 265b2804737595d3534370ca747dc01c4d29bf82
          path: .source/image-helper
          persist-credentials: false
      - name: Download and verify exact released baseline and qualified ELF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .source/runtime rev-parse HEAD)" = "$RUNTIME_REVISION"
          test "$(git -C .source/image-helper rev-parse HEAD)" = "$IMAGE_HELPER_REVISION"
          mkdir -p .inputs/downloaded
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" \
            --pattern '*.bin' --dir .inputs/downloaded
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = '93531640691a0a1b3b6718e01aeca388fe3cbe6c5e4f9f396ff262d0c166fa35'
          matches = [path for path in Path('.inputs/downloaded').glob('*.bin')
                     if path.stat().st_size == 0x1000000 and hashlib.sha256(path.read_bytes()).hexdigest() == expected]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one SHA-verified .39 baseline factory; STOP')
          Path('.inputs/baseline.bin').write_bytes(matches[0].read_bytes())
          PY
          echo 'f0dd72760ece4c9102aa316281663ddd4d90eeabc54ca39f326766ce521f05a7  docs/t063-catalog-diagnostic/springboard.elf' | sha256sum --check --strict
      - name: Assemble diagnostic over byte-exact 0.1.39
        run: |
          set -euo pipefail
          python3 scripts/assemble_catalog_diagnostic.py \
            --baseline .inputs/baseline.bin \
            --springboard docs/t063-catalog-diagnostic/springboard.elf \
            --runtime .source/runtime --image-helper .source/image-helper \
            --source-revision "$GITHUB_SHA" --system-revision "$SYSTEM_REVISION" \
            --output build/catalog-diagnostic
      - name: Verify exact BIN, exercise both banks and package release assets
        run: |
          set -euo pipefail
          python3 scripts/package_catalog_diagnostic.py \
            --baseline .inputs/baseline.bin --candidate build/catalog-diagnostic \
            --runtime .source/runtime --source-revision "$GITHUB_SHA" --output dist/catalog-diagnostic
          (cd dist/catalog-diagnostic && sha256sum --check --strict SHA256SUMS.txt)
      - name: Bind publication to verified asset manifest
        id: digest
        run: echo "sha256=$(sha256sum dist/catalog-diagnostic/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waveshare-catalog-diagnostic-${{ github.sha }}
          path: dist/catalog-diagnostic/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: package
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06' && github.ref == 'refs/heads/fix/t063-catalog-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: waveshare-catalog-diagnostic-${{ github.sha }}
          path: release-assets
      - name: Verify publication asset hashes and exact source
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          if release['source_revision'] != os.environ['GITHUB_SHA'] or release['system_revision'] != os.environ['SYSTEM_REVISION']:
              raise SystemExit('Release source ID mismatch; STOP')
          expected = {line.split('  ', 1)[1] for line in Path('SHA256SUMS.txt').read_text().splitlines()}
          if {p.name for p in Path('.').iterdir()} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('Unverified extra or missing asset; STOP')
          PY
      - name: Create new diagnostic prerelease without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh release create fails if the release already exists. Never use
          # release upload --clobber, release edit, release delete or tag force.
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it." >&2
            exit 1
          fi
          # Refuse an existing tag too: --target must create this tag at this exact commit.
          gh api "repos/$PRODUCT_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/matching-tags.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'matching-tags.json').read_text())
          if any(row['ref'] == 'refs/tags/' + os.environ['RELEASE_TAG'] for row in refs):
              raise SystemExit('Tag already exists; refusing to reuse it')
          PY
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$PRODUCT_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Waveshare 0.1.41 catalog diagnostic (not hardware-qualified)' \
            --notes-file release-assets/RELEASE-NOTES.txt
      - name: Verify published release and downloaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir downloaded-release
          cd downloaded-release
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
