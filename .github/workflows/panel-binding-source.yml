name: Panel binding source
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/panel-binding-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 5323d1e834bdcc8e5e9fb0e8f76c383e46626801
          persist-credentials: false
      - run: git archive HEAD | gzip > runtime-current.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: panel-binding-source
          path: runtime-current.tar.gz
          retention-days: 7
