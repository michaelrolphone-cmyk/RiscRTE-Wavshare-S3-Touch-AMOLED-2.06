name: Apply validated display power dependency
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/apply-display-rail.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-watch
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 76aa47728192531ca9812f3e026057e0b174cb00
          path: .source/shared
          persist-credentials: false
      - name: Apply exact tested source and regress physical providers
        run: |
          python3 provenance/apply_display_rail_013.py
          for flags in '' '-DCO5300_BOOT_PROBE=1' '-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie' '-DCO5300_BOOT_PROBE=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie'; do
            for test in test_rail test_panel test_power; do
              cc -std=c11 -Wall -Wextra -Werror -Wno-misleading-indentation $flags -I.source/shared/sdk/driver -I.source/shared/sdk/app -I.source/shared/include -Iinclude tests/$test.c -o /tmp/$test
              /tmp/$test
            done
          done
      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drivers scripts tests provenance
          if ! git diff --cached --quiet; then
            git commit -m 'Require verified generic power rail before CO5300 reset and initialization'
            git push origin HEAD:feat/universal-watch
          fi
