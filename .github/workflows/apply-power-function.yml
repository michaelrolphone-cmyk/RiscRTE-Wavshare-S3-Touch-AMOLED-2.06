name: Bind panel power function
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/apply-power-function.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-watch
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8aae8df4f9139bea06ff43888ed628c45ed8a057
          path: .source/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 76aa47728192531ca9812f3e026057e0b174cb00
          path: .source/shared
          persist-credentials: false
      - name: Apply explicit hardware function and test
        run: |
          python3 provenance/bind_panel_power_function.py
          python3 scripts/test_board_profile.py
          bash .source/runtime/test/run_i2c_function_test.sh
          SANITIZE=1 bash .source/runtime/test/run_i2c_function_test.sh
          bash .source/runtime/test/run_board_test.sh "$PWD/hardware/board.json"
          for flags in '' '-DCO5300_BOOT_PROBE=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie'; do
            for test in test_rail test_panel test_power; do
              cc -std=c11 -Wall -Wextra -Werror -Wno-misleading-indentation $flags -I.source/shared/sdk/driver -I.source/shared/sdk/app -I.source/shared/include -Iinclude tests/$test.c -o /tmp/$test
              /tmp/$test
            done
          done
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drivers hardware include scripts tests provenance
          git commit -m 'Bind generic panel power to the physical PMIC function and bus'
          git push origin HEAD:feat/universal-watch
