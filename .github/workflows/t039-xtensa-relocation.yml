name: T039 production Xtensa relocation
on:
  push:
    branches: [work/t039-xtensa-relocation-20261022]
  pull_request:
    paths: ['scripts/qualify_t039_xtensa_relocations.py', 'tests/t039-relocation/**', 'tests/test_t039_xtensa_relocations.py', 'docs/t039/relocation/**', '.github/workflows/t039-xtensa-relocation.yml']
permissions:
  contents: read
  actions: read
jobs:
  production-relocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: b7803e6d32ce08fb4060730acc5443416b30148c
          path: .source/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 74f7491dc470b92dfa41fce41bf0c500f3714a94
          path: .source/image-helper
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent ELF parser
        run: python -m pip install pyelftools==0.32
      - name: Preserve original production contracts
        run: |
          python scripts/test_serial_transfer_recipe.py
          python scripts/test_serial_transfer_package.py
          python scripts/test_serial_transfer_pair_plans.py
      - name: Fetch pinned public release and existing candidate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .source/release .source/sdk-headers
          base=https://github.com/michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06/releases/download/test-sd-apps-0.1.64
          for name in sd-apps.zip source-lock.json; do
            curl --fail --location --retry 2 "$base/$name" --output ".source/release/$name"
          done
          curl --fail --location --retry 2 "$base/Waveshare-0.1.64-SD-Apps-Evidence.zip" --output .source/release/evidence.zip
          sdk=https://raw.githubusercontent.com/espressif/esp-idf/fff9895c82d744c7237be8847347bdd1b07c6643
          curl --fail --location --retry 2 "$sdk/components/soc/esp32s3/include/soc/soc.h" --output .source/sdk-headers/soc.h
          curl --fail --location --retry 2 "$sdk/components/esp_common/include/esp_idf_version.h" --output .source/sdk-headers/esp_idf_version.h
          gh api repos/michaelrolphone-cmyk/RiscRTE-Utilities/actions/artifacts/12391275097/zip > .source/utilities-pr98.zip
      - name: Execute production relocations and independent byte oracle
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/qualify_t039_xtensa_relocations.py build --baseline .source/release --runtime .source/runtime --image-helper .source/image-helper --utilities-archive .source/utilities-pr98.zip --sdk-headers .source/sdk-headers --output dist/t039-xtensa-relocation 2>&1 | tee dist/t039-xtensa-relocation.log
      - name: Record independent receipt digest
        if: always()
        id: receipt
        run: |
          test -f dist/t039-xtensa-relocation/qualification.json
          echo "sha256=$(sha256sum dist/t039-xtensa-relocation/qualification.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t039-xtensa-relocation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/t039-xtensa-relocation/
            dist/t039-xtensa-relocation.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: t039-xtensa-relocation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t039-relocation-transported
      - name: Verify transported evidence against producer digest and source
        if: always() && steps.receipt.outcome == 'success'
        run: |
          python scripts/qualify_t039_xtensa_relocations.py verify --artifact "$RUNNER_TEMP/t039-relocation-transported/t039-xtensa-relocation" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --receipt-sha256 "${{ steps.receipt.outputs.sha256 }}"
