name: Catalog payload admission support
on:
  push:
    branches: [work/catalog-payload-admission-audit]
    paths:
      - .github/workflows/catalog-payload-audit.yml
      - scripts/audit_catalog_payload.py
      - scripts/test_catalog_payload.py
      - docs/catalog-payload/**
  pull_request:
    paths:
      - .github/workflows/catalog-payload-audit.yml
      - scripts/audit_catalog_payload.py
      - scripts/test_catalog_payload.py
      - docs/catalog-payload/**
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify inventory, admission and explicit per-file operations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/test_catalog_payload.py
