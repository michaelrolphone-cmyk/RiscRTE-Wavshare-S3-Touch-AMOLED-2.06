name: Display transport source audit
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/display-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: device
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ebae0cccc62b8b0f2bdb1bf1a9d8c9a42666554c
          persist-credentials: false
          path: runtime
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v4.4.7
          persist-credentials: false
          path: idf
          sparse-checkout: |
            components/driver
            components/hal
            components/soc
            components/esp_rom
      - uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-AMOLED-2.06
          ref: b099739ad0e33b34e5fbaae77f02bd84805d79a3
          persist-credentials: false
          path: vendor
          sparse-checkout: |
            examples/arduino/libraries/Arduino_GFX
      - name: Record source identities and native test outcome
        shell: bash
        run: |
          mkdir -p evidence
          for d in device runtime idf vendor; do printf '%s ' "$d"; git -C "$d" rev-parse HEAD; done > evidence/SOURCES.txt
          set +e
          bash runtime/test/run_native_spi_test.sh > evidence/native-test.txt 2>&1
          printf '%s\n' "$?" > evidence/native-test-exit.txt
          cat evidence/native-test.txt
      - name: Archive sources and failure evidence
        if: always()
        run: tar --exclude='.git' -czf display-audit-sources.tar.gz device runtime idf vendor evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-audit-sources
          path: display-audit-sources.tar.gz
          retention-days: 7
