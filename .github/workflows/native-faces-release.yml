name: Waveshare 0.1.47 native-resolution watch faces

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the fully qualified new release
        required: true
        type: boolean
        default: false
  push:
    branches: [release/waveshare-0.1.47-native-faces]
    paths:
      - .github/workflows/native-faces-release.yml
      - scripts/package_native_faces.py
      - scripts/test_native_faces_release.py
      - scripts/verify_native_faces_admission.py
      - scripts/qualify_native_faces.py
      - scripts/stage_faces_baseline_native.py
      - docs/native-faces/**
permissions:
  contents: read
concurrency:
  group: waveshare-test-native-faces-0.1.47
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  BASELINE_TAG: test-native-sdr-0.1.46
  RELEASE_TAG: test-native-faces-0.1.47
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  package:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
      runtime_revision: ${{ steps.pins.outputs.runtime_revision }}
      system_revision: ${{ steps.pins.outputs.system_revision }}
      publication_enabled: ${{ steps.pins.outputs.publication_enabled }}
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact generator Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify and read immutable source pins
        id: pins
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0,'scripts')
          from package_native_faces import PINS, verify_final_pins
          verify_final_pins()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('publication_enabled='+str(PINS['publication_enabled']).lower(),file=out)
              for key in ('watch_revision','runtime_revision','system_revision','utilities_revision','image_helper_revision','vendor_revision'):
                  print(key+'='+PINS[key],file=out)
          PYCODE
      - name: Check out exact shared Watch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: ${{ steps.pins.outputs.watch_revision }}
          path: .source/watch
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact unchanged Runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime_revision }}
          path: .source/runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact System
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_revision }}
          path: .source/system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact Utilities
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.utilities_revision }}
          path: .source/utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact image helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ${{ steps.pins.outputs.image_helper_revision }}
          path: .source/image-helper
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact vendor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: waveshareteam/ESP32-S3-Touch-AMOLED-2.06
          ref: ${{ steps.pins.outputs.vendor_revision }}
          path: .source/vendor
          persist-credentials: false
      - name: Prepare and test exact native composition
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.19 esptool==4.11.0 pyelftools==0.32
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python3 scripts/stage_vendor_display.py --runtime .source/runtime --vendor .source/vendor
          python3 scripts/native_ui_profile.py --runtime .source/runtime
          python3 scripts/test_native_faces_release.py
          python3 tests/test_vendor_native.py
          python3 tests/test_vendor_timing.py
          python3 tests/test_display_perf_decoder.py
          python3 tests/test_home_retained_wake_policy.py
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_native.py --sanitize
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_timing.py --sanitize
          git diff --exit-code
      - name: Download exact official .46 baseline and native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .inputs
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern 'Waveshare-0.1.46-Native-SDR-factory-erases-data-0x0.bin' --pattern 'Waveshare-0.1.46-Native-SDR-evidence.zip' --dir .inputs
          python3 scripts/stage_faces_baseline_native.py --baseline .inputs/Waveshare-0.1.46-Native-SDR-factory-erases-data-0x0.bin --evidence .inputs/Waveshare-0.1.46-Native-SDR-evidence.zip --runtime .source/runtime
      - name: Rebuild Home, qualify native faces, admit all ELFs and prove preserving updates
        run: |
          set -euo pipefail
          python3 scripts/package_native_faces.py \
            --baseline .inputs/Waveshare-0.1.46-Native-SDR-factory-erases-data-0x0.bin \
            --evidence .inputs/Waveshare-0.1.46-Native-SDR-evidence.zip \
            --runtime .source/runtime --watch .source/watch --system .source/system --utilities .source/utilities \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --image-helper .source/image-helper --vendor .source/vendor --source-revision "$GITHUB_SHA" \
            --output dist/native-faces
          (cd dist/native-faces && sha256sum --check --strict SHA256SUMS.txt)
      - name: Bind publication to verified asset manifest
        id: digest
        run: echo "sha256=$(sha256sum dist/native-faces/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waveshare-native-faces-${{ github.sha }}
          path: dist/native-faces/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
        description: Publish the qualified prerelease after final source coordination
        required: true
        type: boolean
        default: false
  push:
    branches: [release/waveshare-0.1.47-native-faces]
    paths:
      - .github/workflows/crash-sdr-release.yml
      - scripts/native_ui_profile.py
      - scripts/verify_crash_sdr_admission.py
      - scripts/qualify_crash_sdr_sources.py
      - scripts/qualify_sdr_native_sources.py
      - scripts/test_sdr_native_qualification.py
      - scripts/replay_crash_sdr_apps.py
      - docs/catalog-display-custody/target-command.json
      - native/VendorDisplay.cpp
      - scripts/decode_display_perf.py
      - tests/test_display_perf_decoder.py
      - tests/test_vendor_timing.py
      - tests/test_vendor_native.py
      - docs/NATIVE_DISPLAY_TIMING.md
      - scripts/stage_vendor_display.py
      - scripts/home_retained_wake_policy.py
      - tests/test_home_retained_wake_policy.py
      - scripts/package_crash_sdr.py
      - scripts/stage_sdr_baseline_native.py
      - scripts/test_sdr_baseline_native.py
      - scripts/test_crash_sdr_release.py
      - scripts/verify_t051_admission.py
      - docs/app-crash-sdr/**

permissions:
  contents: read

concurrency:
  group: waveshare-test-native-sdr-0.1.46
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASELINE_TAG: test-app-crash-sdr-0.1.45
  RELEASE_TAG: test-native-sdr-0.1.46
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  package:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
      runtime_revision: ${{ steps.pins.outputs.runtime_revision }}
      system_revision: ${{ steps.pins.outputs.system_revision }}
      publication_enabled: ${{ steps.pins.outputs.publication_enabled }}
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact generator Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Read exact source pins
        id: pins
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from package_crash_sdr import PINS as pins, verify_final_pins
          verify_final_pins()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('publication_enabled=' + str(pins['publication_enabled']).lower(), file=out)
              for key in ('runtime_revision', 'system_revision', 'bridge_revision', 'image_helper_revision', 'vendor_revision', 'utilities_revision', 'regression_baseline_system', 'sdr_system_revision', 'sdr_utilities_revision'):
                  if not re.fullmatch('[0-9a-f]{40}', pins[key]):
                      raise SystemExit('Missing final immutable source pin: ' + key)
                  print(key + '=' + pins[key], file=out)
          PY
      - name: Check out exact fixed Runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime_revision }}
          path: .source/runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact finalized System source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_revision }}
          path: .source/system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact Utilities regression SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.utilities_revision }}
          path: .source/utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact crash-regression predecessor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.regression_baseline_system }}
          path: .source/baseline-system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out focused SDR application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.sdr_system_revision }}
          path: .source/sdr-system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out focused SDR test and rendering source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.sdr_utilities_revision }}
          path: .source/sdr-utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Check out image and admission helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ${{ steps.pins.outputs.image_helper_revision }}
          path: .source/image-helper
          persist-credentials: false
      - name: Check out pinned vendor display library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: waveshareteam/ESP32-S3-Touch-AMOLED-2.06
          ref: ${{ steps.pins.outputs.vendor_revision }}
          path: .source/vendor
          persist-credentials: false
      - name: Prepare exact native composition
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.19 esptool==4.11.0 pyelftools==0.32
          python3 scripts/stage_vendor_display.py --runtime .source/runtime --vendor .source/vendor
          python3 scripts/native_ui_profile.py --runtime .source/runtime
          python3 tests/test_vendor_native.py
          python3 tests/test_vendor_timing.py
          python3 tests/test_display_perf_decoder.py
          python3 tests/test_home_retained_wake_policy.py
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_native.py --sanitize
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_timing.py --sanitize
          python3 scripts/test_board_profile.py
          python3 scripts/test_native_ui_release.py
          python3 scripts/test_crash_sdr_release.py
          python3 scripts/test_sdr_baseline_native.py
          python3 scripts/test_sdr_native_qualification.py
          python3 .source/system/docs/shared-app-crashes/replay/test_checked_xtensa_link.py
          git diff --exit-code
      - name: Exercise native catalog and atomic dispatch together
        working-directory: .source/runtime
        run: |
          set -euo pipefail
          bash test/run_app_capability_dispatch_tags_test.sh
          for sanitize in 0 1; do
            SANITIZE="$sanitize" bash test/run_native_iq_worker_test.sh
            SANITIZE="$sanitize" bash test/run_radio_iq_test.sh
            SANITIZE="$sanitize" bash test/run_performance_capacity_test.sh
            SANITIZE="$sanitize" bash test/run_app_catalog_runtime_test.sh
            SANITIZE="$sanitize" NATIVE_SETTINGS_LIFECYCLE=1 bash test/run_atomic_key_value_runtime_test.sh
          done
      - name: Download and verify exact published .45 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .inputs/downloaded
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern '*.bin' --dir .inputs/downloaded
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path('docs/app-crash-sdr/source-pins.json').read_text())['baseline_sha256']
          matches = [p for p in Path('.inputs/downloaded').glob('*.bin') if p.stat().st_size == 0x1000000 and hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one SHA-verified .45 factory; STOP')
          Path('.inputs/baseline.bin').write_bytes(matches[0].read_bytes())
          PY
      - name: Download and stage exact official unchanged native ELF and BIN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern 'Waveshare-0.1.45-App-Crash-SDR-evidence.zip' --dir .inputs/downloaded
          python3 scripts/stage_sdr_baseline_native.py --baseline .inputs/baseline.bin \
            --evidence .inputs/downloaded/Waveshare-0.1.45-App-Crash-SDR-evidence.zip --runtime .source/runtime
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Assemble, prove native custody, admit complete store and test preserving kit
        run: |
          set -euo pipefail
          python3 scripts/package_crash_sdr.py \
            --baseline .inputs/baseline.bin --runtime .source/runtime \
            --native .source/runtime/.pio/build/waveshare-t051 \
            --system .source/system --utilities .source/utilities --baseline-system .source/baseline-system \
            --sdr-system .source/sdr-system --sdr-utilities .source/sdr-utilities \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --image-helper .source/image-helper --vendor .source/vendor --source-revision "$GITHUB_SHA" \
            --output dist/crash-sdr
          (cd dist/crash-sdr && sha256sum --check --strict SHA256SUMS.txt)
      - name: Bind publication to verified asset manifest
        id: digest
        run: echo "sha256=$(sha256sum dist/crash-sdr/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waveshare-native-faces-${{ github.sha }}
          path: dist/crash-sdr/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: package
    if: needs.package.outputs.publication_enabled == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06' && github.ref == 'refs/heads/release/waveshare-0.1.47-native-faces'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: waveshare-native-faces-${{ github.sha }}
          path: release-assets
      - name: Verify publication asset hashes and exact source
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
          RUNTIME_REVISION: ${{ needs.package.outputs.runtime_revision }}
          SYSTEM_REVISION: ${{ needs.package.outputs.system_revision }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          if release['source_revision'] != os.environ['GITHUB_SHA'] or release['runtime_revision'] != os.environ['RUNTIME_REVISION'] or release['system_revision'] != os.environ['SYSTEM_REVISION']:
              raise SystemExit('Release source ID mismatch; STOP')
          expected = {line.split('  ', 1)[1] for line in Path('SHA256SUMS.txt').read_text().splitlines()}
          if {p.name for p in Path('.').iterdir()} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('Unverified extra or missing asset; STOP')
          PY
      - name: Publish new prerelease without reusing tags or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh api "repos/$PRODUCT_REPOSITORY/git/matching-refs/tags/" > "$RUNNER_TEMP/matching-tags.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'matching-tags.json').read_text())
          if any(re.search(r'(?<![0-9])0\.1\.47(?![0-9])', row['ref']) for row in refs):
              raise SystemExit('Version 0.1.47 already tagged; refusing reuse')
          PY
          gh release create "$RELEASE_TAG" release-assets/* --repo "$PRODUCT_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Waveshare 0.1.47 native-resolution watch faces' \
            --notes-file release-assets/RELEASE-NOTES.txt
      - name: Verify published source and downloaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir downloaded-release
          cd downloaded-release
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
