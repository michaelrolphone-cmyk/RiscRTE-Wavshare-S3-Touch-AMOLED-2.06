name: Waveshare 0.1.48 shared app launch brightness

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the fully qualified new release
        required: true
        type: boolean
        default: false
  push:
    branches: ['release/waveshare-0.1.48-launch-brightness']
    paths:
      - .github/workflows/launch-brightness-release.yml
      - scripts/package_launch_brightness.py
      - scripts/test_launch_brightness_release.py
      - scripts/package_launch_brightness_media.py
      - scripts/test_launch_brightness_media.py
      - scripts/qualify_launch_brightness.py
      - scripts/stage_launch_baseline_native.py
      - docs/launch-brightness/**
      - docs/launch-brightness-media/**
permissions:
  contents: read
concurrency:
  group: waveshare-test-launch-brightness-0.1.48
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  BASELINE_TAG: 'test-native-faces-0.1.47'
  RELEASE_TAG: 'test-launch-brightness-0.1.48'
  PRODUCT_REPOSITORY: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  package:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.sha256 }}
      runtime_revision: ${{ steps.pins.outputs.runtime_revision }}
      system_revision: ${{ steps.pins.outputs.system_revision }}
      publication_enabled: ${{ steps.pins.outputs.publication_enabled }}
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact generator Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify and read immutable source pins
        id: pins
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0,'scripts')
          from package_launch_brightness import PINS, verify_final_pins
          verify_final_pins()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('publication_enabled='+str(PINS['publication_enabled']).lower(),file=out)
              for key in ('runtime_revision','system_revision','utilities_revision','image_helper_revision','vendor_revision','baseline_system_revision','springboard_revision','bridge_revision'):
                  print(key+'='+PINS[key],file=out)
          PYCODE
      - name: Check out exact unchanged Runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: ${{ steps.pins.outputs.runtime_revision }}
          path: .source/runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact System
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.system_revision }}
          path: .source/system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact regression predecessor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.baseline_system_revision }}
          path: .source/baseline-system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact Springboard qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pins.outputs.springboard_revision }}
          path: .source/springboard-system
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact shared Watch bridges
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: ${{ steps.pins.outputs.bridge_revision }}
          path: .source/bridges
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact Utilities
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.pins.outputs.utilities_revision }}
          path: .source/utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact image helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ${{ steps.pins.outputs.image_helper_revision }}
          path: .source/image-helper
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact vendor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: waveshareteam/ESP32-S3-Touch-AMOLED-2.06
          ref: ${{ steps.pins.outputs.vendor_revision }}
          path: .source/vendor
          persist-credentials: false
      - name: Prepare and test exact native composition
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.19 esptool==4.11.0 pyelftools==0.32 pillow==11.3.0
          python3 -c 'from PIL import Image; import PIL; assert PIL.__version__ == "11.3.0"'
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python3 scripts/stage_vendor_display.py --runtime .source/runtime --vendor .source/vendor
          python3 scripts/native_ui_profile.py --runtime .source/runtime
          python3 scripts/test_launch_brightness_release.py
          python3 scripts/test_launch_brightness_media.py
          python3 .source/system/docs/shared-app-crashes/replay/test_checked_xtensa_link.py
          python3 tests/test_vendor_native.py
          python3 tests/test_vendor_timing.py
          python3 tests/test_display_perf_decoder.py
          python3 tests/test_home_retained_wake_policy.py
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_native.py --sanitize
          ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vendor_timing.py --sanitize
          git diff --exit-code
      - name: Download exact official .47 baseline and native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .inputs
          gh release download "$BASELINE_TAG" --repo "$PRODUCT_REPOSITORY" --pattern 'Waveshare-0.1.47-Native-Faces-factory-erases-data-0x0.bin' --pattern 'Waveshare-0.1.47-Native-Faces-evidence.zip' --dir .inputs
          python3 scripts/stage_launch_baseline_native.py --baseline .inputs/Waveshare-0.1.47-Native-Faces-factory-erases-data-0x0.bin --evidence .inputs/Waveshare-0.1.47-Native-Faces-evidence.zip --runtime .source/runtime
      - name: Replay all 17 repaired apps, qualify shared behavior and preserving updates
        run: |
          set -euo pipefail
          python3 scripts/package_launch_brightness.py \
            --baseline .inputs/Waveshare-0.1.47-Native-Faces-factory-erases-data-0x0.bin \
            --evidence .inputs/Waveshare-0.1.47-Native-Faces-evidence.zip \
            --runtime .source/runtime --system .source/system --utilities .source/utilities \
            --baseline-system .source/baseline-system --springboard-system .source/springboard-system --bridges .source/bridges \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --image-helper .source/image-helper --vendor .source/vendor --source-revision "$GITHUB_SHA" \
            --output dist/launch-brightness
          (cd dist/launch-brightness && sha256sum --check --strict SHA256SUMS.txt)
      - name: Qualify matching external LoRa companion and bind all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 'test-lora-media-0.1.17' --repo "$PRODUCT_REPOSITORY" --pattern 'Waveshare-LoRa-0.1.17-SD-card.zip' --dir .inputs
          python3 scripts/package_launch_brightness_media.py \
            --baseline .inputs/Waveshare-LoRa-0.1.17-SD-card.zip \
            --system .source/system --runtime .source/runtime \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --factory dist/launch-brightness/Waveshare-0.1.48-Launch-Brightness-factory-erases-data-0x0.bin \
            --firmware-release dist/launch-brightness/release.json --source-revision "$GITHUB_SHA" \
            --output dist/launch-brightness-media
          python3 - <<'PYCODE'
          import hashlib, shutil
          from pathlib import Path
          dest=Path('dist/launch-brightness')
          for source in Path('dist/launch-brightness-media/assets').iterdir():
              if not source.is_file() or (dest/source.name).exists():
                  raise SystemExit('Media asset collision or unexpected directory')
              shutil.copyfile(source,dest/source.name)
          files=sorted(p for p in dest.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (dest/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PYCODE
          (cd dist/launch-brightness && sha256sum --check --strict SHA256SUMS.txt)
      - name: Bind publication to verified asset manifest
        id: digest
        run: echo "sha256=$(sha256sum dist/launch-brightness/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waveshare-launch-brightness-${{ github.sha }}
          path: dist/launch-brightness/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: package
    if: needs.package.outputs.publication_enabled == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && github.repository == 'michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06' && github.ref == 'refs/heads/release/waveshare-0.1.48-launch-brightness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: waveshare-launch-brightness-${{ github.sha }}
          path: release-assets
      - name: Verify publication asset hashes and exact source
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
          RUNTIME_REVISION: ${{ needs.package.outputs.runtime_revision }}
          SYSTEM_REVISION: ${{ needs.package.outputs.system_revision }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          if release['source_revision'] != os.environ['GITHUB_SHA'] or release['runtime_revision'] != os.environ['RUNTIME_REVISION'] or release['system_revision'] != os.environ['SYSTEM_REVISION']:
              raise SystemExit('Release source ID mismatch; STOP')
          media=json.loads(Path('Waveshare-0.1.48-LoRa-0.1.18-release.json').read_text())
          if media['source_revision'] != os.environ['GITHUB_SHA'] or media['firmware_source'] != os.environ['GITHUB_SHA'] or media['firmware_factory_sha256'] != release['candidate_sha256'] or media['external_manifest_version'] != '0.1.18' or media['internal_manifest_version'] != '0.1.16':
              raise SystemExit('External media source mismatch; STOP')
          expected = {line.split('  ', 1)[1] for line in Path('SHA256SUMS.txt').read_text().splitlines()}
          if {p.name for p in Path('.').iterdir()} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('Unverified extra or missing asset; STOP')
          PY
      - name: Publish new prerelease without reusing tags or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh api "repos/$PRODUCT_REPOSITORY/git/matching-refs/tags/" > "$RUNNER_TEMP/matching-tags.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'matching-tags.json').read_text())
          if any(re.search(r'(?<![0-9])0\.1\.48(?![0-9])', row['ref']) for row in refs):
              raise SystemExit('Version 0.1.48 already tagged; refusing reuse')
          PY
          gh release create "$RELEASE_TAG" release-assets/* --repo "$PRODUCT_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Waveshare 0.1.48 shared app launch brightness' \
            --notes-file release-assets/RELEASE-NOTES.txt
      - name: Verify published source and downloaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir downloaded-release
          cd downloaded-release
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS.txt" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
