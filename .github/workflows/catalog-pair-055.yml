name: Qualify prepared Wave .55 catalog pair
on:
  push:
    branches: [prepare/catalog-pair-0.1.55]
  pull_request:
    paths:
      - .github/workflows/catalog-pair-055.yml
      - scripts/*catalog_pair*055*.py
      - docs/catalog-payload/pair-0.1.55/**
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: f410c8592ecb37a520df3f29db8d88234dc7ddc9
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 74f7491dc470b92dfa41fce41bf0c500f3714a94
          path: helper
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install jsonschema==4.26.0 pyelftools==0.33
      - name: Replay exact published inputs, native admission and canonical candidates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python product/scripts/run_catalog_pair_055_ci.py --runtime runtime --helper helper --work proof
      - name: Existing support and frozen-schema regressions
        run: |
          python product/scripts/test_catalog_payload.py
          python proof/schema/test_validate.py
