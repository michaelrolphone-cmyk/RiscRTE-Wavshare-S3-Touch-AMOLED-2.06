name: Import canonical FAT core
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/import-storage.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-watch
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 3f59913963840cb5ee8e2a65baa921f8d6af0b4d
          path: .source/reader
          sparse-checkout: Drivers/storage_fatfs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: fe20777f374a7a93bc8e44019ebcb851c5584bb9
          path: .source/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: e49a3da30682eef7bf55716fa8223ac615eebb02
          path: .source/shared
          persist-credentials: false
      - name: Import and test exact production filesystem
        run: |
          if ! test -f provenance/storage.json; then python3 provenance/import_storage.py; fi
          python3 scripts/test_storage.py --watch .source/shared
          python3 scripts/test_storage.py --watch .source/shared --sanitize
      - name: Commit tested dependency and transport source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib include scripts provenance
          if ! git diff --cached --quiet; then
            git commit -m 'Import unchanged FAT core and validate the generic SDMMC volume'
            git push origin HEAD:feat/universal-watch
          fi
